syntax = "proto3";
package kratos.api;

option go_package = "github.com/go-kratos/kratos-layout/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Kafka kafka = 3;
  repeated CronTask cron_tasks = 4;
  Tracing tracing = 5;
}

// Tracing holds OpenTelemetry tracing configuration. When the message is nil
// or no endpoint is configured, tracing setup is skipped (no exporter, no
// global provider).
message Tracing {
  // OTLP/HTTP collector endpoint. Set exactly one of the two fields:
  //   http_endpoint:     "host:port" form (path defaults to /v1/traces, scheme decided by insecure)
  //   http_endpoint_url: full URL form (e.g. "http://collector:4318/v1/traces")
  oneof endpoint {
    string http_endpoint = 1;
    string http_endpoint_url = 2;
  }
  // Sampling ratio in [0, 1]. Unset → AlwaysSample.
  optional float sample_ratio = 3;
  // Exporter timeout. Default: 10s.
  google.protobuf.Duration timeout = 4;
  // Use insecure (HTTP, not HTTPS) when http_endpoint is set.
  optional bool insecure = 5;
  // Override the service.name resource attribute for tracing. Empty → fall
  // back to the process-level SERVICE_NAME.
  string service_name = 6;
}

// CronTask 定时任务配置
message CronTask {
  string name = 1;      // 任务名，匹配 CronJob.Name()
  string schedule = 2;  // cron 表达式，如 "0 8 * * *"
  bool enabled = 3;     // 是否启用
}

// Kafka 消息队列配置
message Kafka {
  string brokers = 1;                            // 逗号分隔的 Broker 地址，如 "127.0.0.1:9092"
  string group_id = 2;                           // Consumer Group ID
  google.protobuf.Duration write_timeout = 3;    // 发送超时，默认 10s
  google.protobuf.Duration read_timeout = 4;     // 读取超时，默认 10s
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string username = 1;
    string password = 2;
    string host = 3;
    int64 port = 4;
    string db_name = 5;
    int64 max_idle_conns = 6;
    int64 max_open_conns = 7;
    string db_charset = 8;
    google.protobuf.Duration conn_max_lifetime = 9;
    google.protobuf.Duration conn_max_idle_time = 10;
    string driver = 11;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    string password = 3;
    int32 db = 4;
    google.protobuf.Duration dial_timeout = 5;
    google.protobuf.Duration read_timeout = 6;
    google.protobuf.Duration write_timeout = 7;
  }

  Database database = 1;
  Redis redis = 2;
}
