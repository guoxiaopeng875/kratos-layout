apiVersion: apps/v1
kind: Deployment
metadata:
  name: xxx-service
  namespace: test
  labels:
    app.kubernetes.io/name: xxx-service
    app.kubernetes.io/part-of: xxx-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xxx-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xxx-service
        app.kubernetes.io/part-of: xxx-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: xxx-service
      imagePullSecrets:
        - name: registrysecret
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      initContainers:
        - name: render-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              sed \
                -e "s|\${DB_PASSWORD}|$DB_PASSWORD|g" \
                -e "s|\${REDIS_PASSWORD}|$REDIS_PASSWORD|g" \
                /etc/xxx-service/template/config.yaml > /etc/xxx-service/rendered/config.yaml
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-credentials
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-credentials
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: config-template
              mountPath: /etc/xxx-service/template
              readOnly: true
            - name: config-rendered
              mountPath: /etc/xxx-service/rendered
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: migrate
          image: REPLACE_WITH_REGISTRY/xxx-service:latest
          imagePullPolicy: Always
          command:
            - migrate
            - -conf
            - /etc/xxx-service/rendered/config.yaml
          volumeMounts:
            - name: config-rendered
              mountPath: /etc/xxx-service/rendered
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: xxx-service
          image: REPLACE_WITH_REGISTRY/xxx-service:latest
          imagePullPolicy: Always
          command:
            - server
            - -conf
            - /etc/xxx-service/rendered/config.yaml
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: grpc
              containerPort: 9000
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: LOG_LEVEL
              value: "info"
            - name: SERVICE_NAME
              value: "xxx-service"
            - name: NACOS_SERVER_ADDRS
              value: "nacos:8848"
            - name: NACOS_NAMESPACE_ID
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config-rendered
              mountPath: /etc/xxx-service/rendered
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config-template
          configMap:
            name: xxx-service-config
        - name: config-rendered
          emptyDir: {}
        - name: tmp
          emptyDir: {}
