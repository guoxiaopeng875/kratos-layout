# This file documents the secrets required by xxx-service.
# Do NOT commit real secrets to git.
#
# Secrets used:
#   - shared-credentials (shared across services): DB_PASSWORD, REDIS_PASSWORD
#   - registrysecret: Docker registry pull credentials
#
# Shared credentials should already exist in the namespace.
# If not, create them:
#   kubectl create secret generic shared-credentials \
#     --from-literal=DB_PASSWORD='xxx' \
#     --from-literal=REDIS_PASSWORD='xxx' \
#     -n test
